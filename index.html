<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinball Construction Kit 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=VT323&family=Bungee&family=Monoton&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<style>
:root {
  --bg: #15151c; --panel: #1e1f29; --text: #e8e8f0; --accent: #ff8a1c; --accent-ink: #000;
  --hudbg: #120800; --hudtext: #ff8a1c;
  --line: color-mix(in srgb, var(--text) 14%, transparent);
  --soft: color-mix(in srgb, var(--text) 6%, transparent);
  --muted: color-mix(in srgb, var(--text) 62%, transparent);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, system-ui, sans-serif; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
#app { display: grid; grid-template-rows: 50px 1fr; grid-template-columns: 212px 1fr 290px; height: 100vh; }
body.play #viewport { grid-column: 1 / -1; }
body.play #partsbox, body.play #inspector { display: none; }

/* ---------- top bar ---------- */
#topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.brand { font-family: Orbitron, sans-serif; font-weight: 700; letter-spacing: .08em; font-size: 12px; white-space: nowrap; margin-right: 6px; display: flex; align-items: center; gap: 8px; }
.brand .logo { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b9bfc9 35%, #4b505a 75%, #1b1d22); box-shadow: 0 0 0 2px var(--accent); }
.brand i { color: var(--accent); font-style: normal; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; flex: none; }
.grow { flex: 1; }
.btn { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.play { font-weight: 700; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.danger:hover { border-color: #e5484d; color: #ff8589; }
.seg { display: flex; gap: 4px; }

/* ---------- side panels ---------- */
#partsbox, #inspector { background: var(--panel); overflow: auto; padding: 10px; scrollbar-width: thin; }
#partsbox { border-right: 1px solid var(--line); }
#inspector { border-left: 1px solid var(--line); }
.sec { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 14px 2px 6px; }
.sec:first-child { margin-top: 2px; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 6px; border-radius: 9px; background: var(--soft); border: 1px solid transparent; cursor: pointer; font-size: 11px; text-align: center; line-height: 1.15; }
.tool svg { width: 26px; height: 26px; }
.tool:hover { border-color: var(--line); }
.tool.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
.tool.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 8px; }
.tool.wide svg { width: 18px; height: 18px; }
h3 { margin: 2px 0 10px; font-family: Orbitron, sans-serif; font-size: 13px; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
h3 .grow { flex: 1; }
.row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; margin: 6px 0; }
.row label { color: var(--muted); font-size: 12px; }
.row input[type=number], .row input[type=text], .row select, textarea { width: 100%; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
.row select option { background: var(--panel); }
.row input[type=range] { width: 100%; accent-color: var(--accent); }
.rng { display: grid; grid-template-columns: 1fr 44px; gap: 6px; align-items: center; }
.rng output { font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; color: var(--muted); }
.col { display: flex; gap: 6px; align-items: center; }
.col input[type=color] { width: 38px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
.col .tag { font-size: 11px; color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
.hint kbd, .kbd { display: inline-block; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; font: 11px/16px Inter, sans-serif; background: var(--soft); }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.card { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 8px 0; }

/* ---------- viewport ---------- */
#viewport { position: relative; overflow: hidden; background: #000; min-width: 0; }
#viewport canvas { display: block; touch-action: none; }
#status { position: absolute; left: 10px; bottom: 10px; font-size: 12px; color: #fff; background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 6px; pointer-events: none; backdrop-filter: blur(4px); }
body.play #status { display: none; }
#brush { position: absolute; border: 1.5px solid #fff; border-radius: 50%; pointer-events: none; mix-blend-mode: difference; display: none; transform: translate(-50%, -50%); }
#toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .25s; pointer-events: none; font-size: 13px; }
#toast.show { opacity: 1; }
#hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); color: #fff; font-size: 12px; background: rgba(0,0,0,.5); padding: 6px 12px; border-radius: 20px; pointer-events: none; display: none; white-space: nowrap; transition: opacity 1s; }
body.play #hint { display: block; }
#playBar { position: absolute; top: 12px; left: 12px; display: none; gap: 6px; align-items: center; }
body.play #playBar { display: flex; }
#playBar select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }

/* ---------- HUD / score display ---------- */
#hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: none; pointer-events: none; }
body.play #hud { display: block; }
.dmd { position: relative; min-width: min(460px, 90vw); padding: 6px 22px 8px; border-radius: 10px; background: var(--hudbg); box-shadow: 0 0 0 2px #000, 0 0 0 5px #2a2a2e, 0 12px 30px rgba(0,0,0,.6); color: var(--hudtext); text-align: center; overflow: hidden; }
.dmd::after { content: ''; position: absolute; inset: 0; pointer-events: none; }
.dmd .l1, .dmd .l3 { font-size: 18px; line-height: 1.05; letter-spacing: .12em; opacity: .85; white-space: nowrap; }
.dmd .l2 { font-size: 48px; line-height: 1; letter-spacing: .06em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dmd .l2.msg { font-size: 36px; line-height: 48px; }
.hud-dmd .dmd { font-family: VT323, monospace; text-shadow: 0 0 8px var(--hudtext); }
.hud-dmd .dmd::after { background: radial-gradient(circle, transparent 42%, rgba(0,0,0,.6) 58%) 0 0 / 4px 4px; }
.hud-vfd .dmd { font-family: Orbitron, sans-serif; text-shadow: 0 0 10px var(--hudtext), 0 0 2px #fff; }
.hud-vfd .dmd .l2 { font-size: 38px; line-height: 48px; font-weight: 700; }
.hud-vfd .dmd .l1, .hud-vfd .dmd .l3 { font-size: 13px; line-height: 22px; }
.hud-vfd .dmd::after { background: repeating-linear-gradient(90deg, transparent 0 3px, rgba(0,0,0,.35) 3px 4px); }
.hud-lcd .dmd { font-family: VT323, monospace; text-shadow: 1px 1px 0 color-mix(in srgb, var(--hudtext) 30%, transparent); box-shadow: inset 0 0 20px rgba(0,0,0,.25), 0 0 0 2px #000, 0 0 0 5px #444, 0 12px 30px rgba(0,0,0,.6); }
.hud-led .dmd { font-family: Bungee, sans-serif; text-shadow: 0 0 12px var(--hudtext); }
.hud-led .dmd .l2 { font-size: 36px; line-height: 48px; }
.hud-led .dmd .l1, .hud-led .dmd .l3 { font-size: 14px; line-height: 22px; font-family: Orbitron; }
.hud-led .dmd::after { background: radial-gradient(circle, transparent 50%, rgba(0,0,0,.45) 62%) 0 0 / 5px 5px; }

/* ---------- dialogs ---------- */
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 0; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
dialog::backdrop { background: rgba(0,0,0,.5); backdrop-filter: blur(2px); }
dialog .dh { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
dialog .dh h2 { margin: 0; font: 700 14px Orbitron, sans-serif; letter-spacing: .06em; flex: 1; }
dialog .db { padding: 12px 14px 16px; }
#modal { width: min(560px, 94vw); max-height: 86vh; }
#panel { position: fixed; margin: 0; left: auto; right: 12px; top: 62px; width: min(360px, 94vw); max-height: calc(100vh - 80px); overflow: auto; }
.x { background: none; border: 0; font-size: 18px; cursor: pointer; color: var(--muted); padding: 0 4px; }
.cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
.cgrid .col { justify-content: space-between; background: var(--soft); padding: 3px 4px 3px 8px; border-radius: 6px; }
.cgrid .col span { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cgrid input[type=color] { width: 30px; height: 22px; flex: none; }
.list { display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; }
.item .grow { min-width: 0; }
.item b { display: block; }
.item small { color: var(--muted); }
.swatches { display: flex; gap: 3px; }
.swatches i { width: 12px; height: 12px; border-radius: 3px; display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice button { text-align: left; padding: 14px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); cursor: pointer; }
.choice button:hover { border-color: var(--accent); }
.choice b { display: block; font-family: Orbitron; margin-bottom: 4px; }
table.rules { width: 100%; border-collapse: collapse; }
table.rules td, table.rules th { padding: 4px; text-align: left; font-size: 12px; }
table.rules th { color: var(--muted); font-weight: 600; }
table.rules input, table.rules select { width: 100%; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
table.rules select option { background: var(--panel); }
select.btn { appearance: none; padding-right: 10px; }
select.btn option, #playBar select option { background: var(--panel); }
@media (max-width: 700px) {
  #playBar { top: auto; bottom: 12px; }
  body.play #hint { display: none; }
}
@media (max-width: 900px) {
  #app { grid-template-columns: 150px 1fr 0; }
  #inspector { display: none; }
  .brand span:last-child { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo"></span><span>PINBALL CONSTRUCTION KIT <i>3D</i></span></div>
    <div class="seg" id="modeSeg">
      <button class="btn active" data-mode="edit" title="Build mode">✎ Build</button>
      <button class="btn" data-mode="paint" title="Paint the playfield">🖌 Paint</button>
      <button class="btn play" data-mode="play" title="Play (Tab)">▶ Play</button>
    </div>
    <div class="sep"></div>
    <button class="btn" id="bNew">New</button>
    <button class="btn" id="bOpen">Open</button>
    <button class="btn" id="bSave" title="Save (Ctrl/Cmd+S)">Save</button>
    <button class="btn" id="bExport">Export</button>
    <button class="btn" id="bImport">Import</button>
    <div class="sep"></div>
    <button class="btn" id="bUndo" title="Undo (Ctrl/Cmd+Z)">↶</button>
    <button class="btn" id="bRedo" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button>
    <button class="btn active" id="bSnap" title="Grid snap (G)">Snap</button>
    <div class="grow"></div>
    <select class="btn" id="gfxSel" title="Graphics quality — lower settings are easier on the GPU"><option value="high">✦ High</option><option value="balanced">✦ Balanced</option><option value="low">✦ Low</option></select>
    <button class="btn" id="bTheme">🎨 Theme</button>
    <button class="btn" id="bPhysics">⚙ Physics</button>
    <button class="btn" id="bRules">★ Rules</button>
    <button class="btn" id="bHelp">?</button>
  </header>
  <aside id="partsbox"></aside>
  <main id="viewport">
    <div id="hud" class="hud-dmd"><div class="dmd"><div class="l1" id="hud1"></div><div class="l2" id="hud2"></div><div class="l3" id="hud3"></div></div></div>
    <div id="playBar"><button class="btn" id="exitPlay">✕ Exit (Esc)</button>
      <select id="camSel" title="Camera (C)"><option value="cabinet">🎥 Cabinet</option><option value="chase">🎥 Ball chase</option><option value="overhead">🎥 Overhead</option><option value="low">🎥 Low angle</option></select></div>
    <div id="hint">⇧ / Z / ← left flipper · ⇧ / / / → right flipper · SPACE plunger · X nudge · C camera · 1–4 start · P pause · ESC edit</div>
    <div id="status"></div>
    <div id="brush"></div>
    <div id="toast"></div>
  </main>
  <aside id="inspector"></aside>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="imgIn" accept="image/*" hidden>
<dialog id="modal"></dialog>
<dialog id="panel"></dialog>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   Utilities
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const D2R = Math.PI / 180;
const deep = o => JSON.parse(JSON.stringify(o));
const fmt = n => Math.round(n).toLocaleString('en-US');
const uid = () => 'p' + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function rotPt(x, y, a) { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }
function toWorld(p, lx, ly) { const sc = p.scale || 1; const [rx, ry] = rotPt(lx * sc, ly * sc, (p.rot || 0) * D2R); return [p.x + rx, p.y + ry]; }
function toLocal(p, wx, wy) { const sc = p.scale || 1; const [rx, ry] = rotPt(wx - p.x, wy - p.y, -(p.rot || 0) * D2R); return [rx / sc, ry / sc]; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ink(hex) { const c = new THREE.Color(hex); const l = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b; return l > 0.35 ? '#000000' : '#ffffff'; }
function shade(hex, k) { const c = new THREE.Color(hex); return '#' + c.multiplyScalar(k).getHexString(); }
function ptInPoly(x, y, poly) { let ins = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) ins = !ins; } return ins; }
function distSeg(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; const l2 = dx * dx + dy * dy || 1e-9; const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1); return Math.hypot(px - ax - dx * t, py - ay - dy * t); }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
const imgCache = new Map();
function loadImage(src) {
  if (!src) return Promise.resolve(null);
  if (imgCache.has(src)) return imgCache.get(src);
  const pr = new Promise(res => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => { toast('Could not load image'); res(null); }; im.src = src; });
  imgCache.set(src, pr); return pr;
}
function drawCover(ctx, img, W, H, alpha = 1) { const s = Math.max(W / img.width, H / img.height); const w = img.width * s, h = img.height * s; ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h); ctx.restore(); }

/* =====================================================================
   Constants
   ===================================================================== */
const BALL_R = 0.53;                                    // units ≈ inches
const TABLE = { minX: -10.2, maxX: 10.2, minY: -4, maxY: 44.5 };
const PF_S = 48;                                        // playfield texture px per unit
const PF_W = Math.round((TABLE.maxX - TABLE.minX) * PF_S), PF_H = Math.round((TABLE.maxY - TABLE.minY) * PF_S);
const CX = -0.85;                                        // centre of the main playfield (plunger lane on the right)
const WALL_STYLES = {
  wood:    { label: 'Wood wall',     h: 2.0,  y0: 0,    e: 0.35, fr: 0.03 },
  plastic: { label: 'Plastic guide', h: 1.25, y0: 0,    e: 0.45, fr: 0.03 },
  metal:   { label: 'Metal rail',    h: 0.7,  y0: 0.22, e: 0.30, fr: 0.01 },
  rubber:  { label: 'Rubber band',   h: 0.42, y0: 0.28, e: 0.75, fr: 0.05, posts: true },
};

/* =====================================================================
   Themes
   ===================================================================== */
const COLOR_KEYS = [
  ['bg1', 'Backdrop top'], ['bg2', 'Backdrop bottom'], ['playfield', 'Playfield'], ['pattern', 'Pattern'],
  ['cabinet', 'Cabinet wood'], ['apron', 'Apron'], ['metal', 'Metal / rails'], ['guide', 'Plastic guides'],
  ['rubber', 'Rubbers'], ['flipper', 'Flipper'], ['flipperRubber', 'Flipper rubber'], ['bumperCap', 'Bumper cap'],
  ['bumperBody', 'Bumper body'], ['bumperGlow', 'Bumper glow'], ['sling', 'Slingshot'], ['slingGlow', 'Sling glow'],
  ['dropTarget', 'Drop target'], ['standup', 'Standup target'], ['rollover', 'Rollover'], ['rolloverLit', 'Rollover lit'],
  ['spinner', 'Spinner'], ['lamp', 'Lamp inserts'], ['ball', 'Ball'], ['keyLight', 'Key light'],
  ['fill1', 'Accent light 1'], ['fill2', 'Accent light 2'], ['hudBg', 'Display bg'], ['hudText', 'Display text'],
  ['uiBg', 'UI background'], ['uiPanel', 'UI panels'], ['uiText', 'UI text'], ['uiAccent', 'UI accent'],
];
const MAT_KEYS = [
  ['ballRough', 'Ball roughness', 0, 0.6, 0.01], ['gloss', 'Playfield gloss', 0, 1, 0.01], ['glow', 'Light glow', 0.2, 2.5, 0.05],
  ['bloom', 'Bloom', 0, 2.5, 0.05], ['env', 'Reflections', 0, 2, 0.05], ['exposure', 'Exposure', 0.4, 2, 0.05],
  ['ambient', 'Ambient light', 0, 2, 0.05], ['lights', 'Accent lights', 0, 3, 0.05], ['backdrop', 'Backdrop brightness', 0, 1.5, 0.05],
];
const PATTERNS = ['none', 'rays', 'grid', 'checker', 'stars', 'wood', 'circles', 'diamonds', 'stripes'];
const HUD_STYLES = { dmd: 'Dot matrix', vfd: 'Vacuum fluorescent', lcd: 'LCD', led: 'Marquee' };

function mkTheme(name, colors, o = {}) {
  return {
    name, colors,
    mat: Object.assign({ ballRough: 0.06, gloss: 0.8, glow: 1, bloom: 0.7, env: 1, exposure: 1.05, ambient: 0.6, lights: 1, backdrop: 0.85 }, o.mat),
    pattern: o.pattern || 'rays', patternOpacity: o.patternOpacity ?? 0.35,
    images: { background: '', playfield: '', backglass: '' }, imageOpacity: 1,
    hud: o.hud || 'dmd', sound: Object.assign({ preset: 'classic', volume: 0.7 }, o.sound),
  };
}
const THEME_PRESETS = {
  classic: mkTheme("Classic '83", {
    bg1: '#0a0a1a', bg2: '#3a1250', playfield: '#12348a', pattern: '#2f66e0', cabinet: '#7a4424', apron: '#d8d4c8',
    metal: '#c9ced6', guide: '#f2f0ea', rubber: '#f5f5f0', flipper: '#f6f6f2', flipperRubber: '#d61f1f',
    bumperCap: '#e8322c', bumperBody: '#fff4e0', bumperGlow: '#ff6a3c', sling: '#ffd23c', slingGlow: '#ffcc33',

const typing = e => /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'checkbox' && e.target.type !== 'color';
addEventListener('keydown', e => {
  if (typing(e)) return;

  if (e.code === 'Tab') { e.preventDefault(); setMode(mode === 'play' ? 'edit' : 'play'); return; }
  if (mod && e.code === 'KeyS') { e.preventDefault(); saveTable(); return; }

    const a = KEYMAP[e.code];

  if (mod && e.code === 'KeyD') { e.preventDefault(); duplicateSel(); return; }

    case 'Enter': finishWall(); break;

    case 'KeyV': setTool('select'); break;
    case 'KeyW': setTool('wall'); break;
    case 'KeyF': fitEditorView(); updateSelHelper(); break;
    case 'KeyQ': case 'KeyE': if (p) { pushHistory(); p.rot = +(((p.rot || 0) + (e.code === 'KeyQ' ? 1 : -1) * (e.shiftKey ? 1 : 15))).toFixed(2); refreshPart(p); updateSelHelper(); renderInspector(); changed(); } break;

  }
});

      m.querySelectorAll('[data-img]').forEach(b => b.onclick = () => pickImage(src => setImg(b.dataset.img, src)));
      m.querySelectorAll('[data-url]').forEach(b => b.onclick = () => { const u = prompt('Image URL (the host must allow cross-origin use):'); if (u) setImg(b.dataset.url, u.trim()); });
      m.querySelectorAll('[data-clr]').forEach(b => b.onclick = () => setImg(b.dataset.clr, ''));
      q('#thSave').onclick = () => { const l = themeLib(); l[theme.name] = deep(theme); if (store.set('pck3d.themes', l)) toast(`Theme “${theme.name}” saved`); else toast('Browser storage is full — export the theme instead', 3500); openThemePanel(); };
      q('#thExport').onclick = () => download(`${theme.name.replace(/[^\w-]+/g, '_')}.theme.json`, JSON.stringify(theme, null, 1));
      q('#thImport').onclick = () => $('#fileIn').click();
      q('#thDel') && (q('#thDel').onclick = () => { const l = themeLib(); delete l[theme.name]; store.set('pck3d.themes', l); openThemePanel(); });
    });
}
$('#bTheme').onclick = openThemePanel;

/* =====================================================================
   Resize + main loop
   ===================================================================== */
function onResize() {
  const [w, h] = viewSize(); renderer.setSize(w, h, false); renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h);
  perspCam.aspect = w / h; perspCam.updateProjectionMatrix(); updateOrtho(); fitBackdrop();
}
new ResizeObserver(onResize).observe(viewport);
// Graphics quality presets: resolution, shadows, bloom and accent lights are the big GPU costs.
const GFX = {
  high:     { dpr: 2,   shadows: true,  shadowSize: 2048, soft: true,  bloom: true,  fills: true },
  balanced: { dpr: 1.5, shadows: true,  shadowSize: 1024, soft: false, bloom: true,  fills: true },
  low:      { dpr: 1,   shadows: false, shadowSize: 512,  soft: false, bloom: false, fills: false },
};
let gfx = GFX[store.get('pck3d.gfx')] ? store.get('pck3d.gfx') : 'high';
function applyGfx(q) {
  gfx = q; const G = GFX[q]; store.set('pck3d.gfx', q);
  renderer.setPixelRatio(Math.min(devicePixelRatio, G.dpr));
  renderer.shadowMap.enabled = G.shadows; renderer.shadowMap.type = G.soft ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap; key.castShadow = G.shadows;
  if (key.shadow.mapSize.x !== G.shadowSize) { key.shadow.mapSize.set(G.shadowSize, G.shadowSize); key.shadow.map?.dispose(); key.shadow.map = null; }
  [fillA, fillB, fillC].forEach(l => l.visible = G.fills);
  scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => m.needsUpdate = true); });   // recompile for shadow changes
  $('#gfxSel').value = q; onResize();
}
$('#gfxSel').onchange = e => { applyGfx(e.target.value); e.target.blur(); toast('Graphics: ' + e.target.selectedOptions[0].text.slice(2)); };
const H_STEP = 1 / 960;
let acc = 0, lastT = performance.now();
const EDIT_ST = {};
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; clock += dt;
  if (mode === 'play' && sim) {
    if (!paused) {
      acc += dt * table.physics.speed; let n = 0;
      while (acc >= H_STEP && n < 80) { sim.step(H_STEP); acc -= H_STEP; n++; }
      if (n >= 80) acc = 0;
      sim.frame(dt * table.physics.speed); game.tick(dt);
    }
    const b = sim.balls[0]; sfx.roll(b && !b.cap ? Math.hypot(b.vx, b.vy) : 0, !!b && !paused);
    syncBalls(); updatePlayCam(dt); updateHUD(dt);
  }
  for (const p of table.parts) { const o = objs.get(p.id); if (o?.userData.anim) o.userData.anim(dt, sim && mode === 'play' ? sim.st.get(p.id) || EDIT_ST : EDIT_ST, clock); }
  if (pfDirty) { pfDirty = false; composePlayfield(); }
  if (GFX[gfx].bloom) composer.render(dt); else renderer.render(scene, renderPass.camera);
}

/* =====================================================================
   Boot
   ===================================================================== */
window.PCK = { THREE, scene, renderer, bloom, key, hemi, orthoCam, perspCam, get table() { return table; }, get sim() { return sim; }, game, setMode, ev, input, press, CAM, snapCam() { const t = camTarget(); camCur.pos.copy(t.pos); camCur.look.copy(t.look); },
  step(sec) { const n = Math.round(sec / H_STEP); for (let i = 0; i < n && sim; i++) { sim.step(H_STEP); if (i % 16 === 0) { sim.frame(H_STEP * 16); game.tick(H_STEP * 16); } } } };
(async function boot() {
  renderPartsBox(); applyGfx(gfx);
  const saved = store.get('pck3d.autosave', null);
  await loadTable(saved && Array.isArray(saved.parts) ? saved : demoTable());
  setTool('select');
  requestAnimationFrame(frame);
  document.fonts?.ready.then(() => { drawBackglass(); drawApron(); rebuildAll(); });
})();
</script>
